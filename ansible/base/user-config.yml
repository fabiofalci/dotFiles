- name: bashrc
  lineinfile:
    path: ~/.bashrc
    regexp: '^source {{ dotFilesPath }}/bash/bashrc$'
    line: source {{ dotFilesPath }}/bash/bashrc

- name: bashrc
  lineinfile:
    path: ~/.bashrc
    regexp: '^source {{ dotFilesPath }}/bash/defaults_linux$'
    line: source {{ dotFilesPath }}/bash/defaults_linux

- name: ackrc
  file:
    src: "{{ dotFilesPath }}/ack/ackrc"
    dest: ~/.ackrc
    state: link

- name: gitconfig
  file:
    src: "{{ dotFilesPath }}/gitconfig/gitconfig"
    dest: ~/.gitconfig
    state: link

- name: gitignore
  file:
    src: "{{ dotFilesPath }}/gitconfig/gitignore"
    dest: ~/.gitignore_global
    state: link

- name: vimrc
  file:
    src: "{{ dotFilesPath }}/vim/vimrc"
    dest: ~/.vimrc
    state: link

- name: vim
  file:
    src: "{{ dotFilesPath }}/vim/"
    dest: ~/.vim
    state: link

- name: tmux
  copy:
    src: "{{ dotFilesPath }}/tmux/tmux.conf"
    dest: ~/.tmux.conf
    force: no

- name: alacritty folder
  when: desktop is defined
  file:
    path: ~/.config/alacritty
    state: directory
    mode: '0755'

- name: alacritty
  when: desktop is defined
  file:
    src: "{{ dotFilesPath }}/alacritty/alacritty.toml"
    dest: ~/.config/alacritty/alacritty.toml
    state: link

