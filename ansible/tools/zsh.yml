---
- name: Ensure zsh installed
  become: yes
  pacman:
    name: zsh
    state: present

- name: Clone oh-my-zsh
  become: yes
  become_user: "{{ user }}"
  git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: ~/.oh-my-zsh
    clone: yes
    update: no

- name: Basic zshrc
  become: yes
  become_user: "{{ user }}"
  template:
    src: ../templates/zshrc-basic.j2
    dest: ~/.zshrc
    force: no
